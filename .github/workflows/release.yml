name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps (winit + xcap PipeWire)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libpipewire-0.3-dev libegl-dev libgbm-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          JLOCAL_VERSION: ${{ github.ref_name }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/jlocal"
          STAGE="dist/jlocal-${TAG}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/jlocal"
          cp README.md "$STAGE/" || true
          tar -czf "dist/jlocal-${TAG}-${{ matrix.target }}.tar.gz" -C dist "jlocal-${TAG}-${{ matrix.target }}"

      - name: App bundle (macOS)
        if: runner.os == 'macOS'
        env:
          TAG: ${{ github.ref_name }}
          BIN: target/${{ matrix.target }}/release/jlocal
        run: ./packaging/make-app.sh dist

      - name: DMG (macOS)
        if: runner.os == 'macOS'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          brew install create-dmg
          STAGE="dist/dmg-staging"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R dist/JLocal.app "$STAGE/"
          create-dmg \
            --volname "jlocal ${TAG}" \
            --window-size 1320 840 \
            --icon "JLocal.app" 260 460 \
            --app-drop-link 1060 460 \
            --background "packaging/dmg-background.png" \
            "dist/jlocal-${TAG}-${{ matrix.target }}.dmg" \
            "$STAGE"

      - name: Package (windows)
        if: runner.os == 'Windows'
        env:
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $stage = "dist/jlocal-$env:TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/jlocal.exe" "$stage/jlocal.exe"
          if (Test-Path README.md) { Copy-Item README.md $stage }
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/jlocal-$env:TAG-${{ matrix.target }}.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jlocal-${{ matrix.target }}
          path: dist/*

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz *.zip *.dmg > sha256sums.txt || shasum -a 256 -- *.tar.gz *.zip *.dmg > sha256sums.txt
          cat sha256sums.txt

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "jlocal $TAG" \
            --notes "jlocal $TAG — local companion: live torrent engine, native capture/audio inventory, loopback API on 127.0.0.1:40392. See README for install steps per OS." \
            dist/*.tar.gz dist/*.zip dist/*.dmg dist/sha256sums.txt
