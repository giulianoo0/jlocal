[package]
name = "jlocal"
version = "0.1.0"
edition = "2021"
description = "jlocal — local companion for juntos.lol: local torrent + high-quality screenshare via MoQ relay"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-stream = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winit = "0.30"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
